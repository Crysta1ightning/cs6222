<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#172033">
<rect x="465" y="20" width="570" height="105" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="485" y="59" font-size="26" text-anchor="start" fill="#172033">HiCache enabled</text>
<text x="485" y="98" font-size="21" text-anchor="start" fill="#172033">GPU KV data may be backed up to CPU RAM.</text>
<text x="40" y="175" font-size="28" text-anchor="start" fill="#172033">1. Base write policy: which backup opportunities are created?</text>
<rect x="40" y="200" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="239" font-size="26" text-anchor="start" fill="#172033">Write-through</text>
<text x="60" y="278" font-size="21" text-anchor="start" fill="#172033">Offer backups eagerly.</text>
<text x="60" y="308" font-size="21" text-anchor="start" fill="#172033">Create host copies ahead of eviction.</text>
<rect x="530" y="200" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="550" y="239" font-size="26" text-anchor="start" fill="#172033">Selective write-through</text>
<text x="550" y="278" font-size="21" text-anchor="start" fill="#172033">Offer eager backups for entries</text>
<text x="550" y="308" font-size="21" text-anchor="start" fill="#172033">that meet the reuse threshold.</text>
<rect x="1020" y="200" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="1040" y="239" font-size="26" text-anchor="start" fill="#172033">Write-back</text>
<text x="1040" y="278" font-size="21" text-anchor="start" fill="#172033">Try to preserve data at eviction,</text>
<text x="1040" y="308" font-size="21" text-anchor="start" fill="#172033">rather than backing it up eagerly.</text>
<path d="M265 345 V375 H1245 V345 M755 345 V375" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M755 375 L755 415" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#tip)"/>
<text x="40" y="445" font-size="22" text-anchor="start" fill="#172033">Choose one base write policy, then choose its tool-activity behavior.</text>
<text x="40" y="480" font-size="28" text-anchor="start" fill="#172033">2. Tool-activity control: what happens to optional backups?</text>
<rect x="40" y="505" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="544" font-size="26" text-anchor="start" fill="#172033">Normal</text>
<text x="60" y="583" font-size="21" text-anchor="start" fill="#172033">Keep ordinary backup scheduling.</text>
<text x="60" y="613" font-size="21" text-anchor="start" fill="#172033">Tool activity does not gate copies.</text>
<rect x="530" y="505" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="550" y="544" font-size="26" text-anchor="start" fill="#172033">Defer</text>
<text x="550" y="583" font-size="21" text-anchor="start" fill="#172033">Hold optional backups during tools.</text>
<text x="550" y="613" font-size="21" text-anchor="start" fill="#172033">Resume normally when tools end.</text>
<rect x="1020" y="505" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="1040" y="544" font-size="26" text-anchor="start" fill="#172033">Skip</text>
<text x="1040" y="583" font-size="21" text-anchor="start" fill="#172033">Decline optional backups during tools.</text>
<text x="1040" y="613" font-size="21" text-anchor="start" fill="#172033">Do not create a deferred backlog.</text>
<path d="M755 650 L755 700" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#tip)"/>
<rect x="320" y="710" width="870" height="150" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="340" y="749" font-size="26" text-anchor="start" fill="#172033">When deferred work must make progress</text>
<text x="340" y="788" font-size="21" text-anchor="start" fill="#172033">GPU-space pressure, queue bounds, or the age limit can force copies.</text>
<text x="340" y="818" font-size="21" text-anchor="start" fill="#172033">If eviction needs data that is not yet backed up, choose how much</text>
<text x="340" y="848" font-size="21" text-anchor="start" fill="#172033">of the pending queue to copy before reclaiming that GPU storage.</text>
<path d="M755 865 L755 880" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#tip)"/>
<text x="40" y="915" font-size="28" text-anchor="start" fill="#172033">3. Allocation-critical queue selection: how much would we copy?</text>
<rect x="40" y="980" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="1019" font-size="26" text-anchor="start" fill="#172033">Flush the whole queue</text>
<text x="60" y="1058" font-size="21" text-anchor="start" fill="#172033">Copy every pending entry.</text>
<text x="60" y="1088" font-size="21" text-anchor="start" fill="#172033">Empty the pending queue.</text>
<path d="M755 935 L265 972" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#tip)"/>
<rect x="530" y="980" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="550" y="1019" font-size="26" text-anchor="start" fill="#172033">Extract victim only</text>
<text x="550" y="1058" font-size="21" text-anchor="start" fill="#172033">Copy the selected victim.</text>
<text x="550" y="1088" font-size="21" text-anchor="start" fill="#172033">Keep other entries queued.</text>
<path d="M755 935 L755 972" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#tip)"/>
<rect x="1020" y="980" width="450" height="140" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="1040" y="1019" font-size="26" text-anchor="start" fill="#172033">Flush through the victim</text>
<text x="1040" y="1058" font-size="21" text-anchor="start" fill="#172033">Copy earlier entries plus the victim.</text>
<text x="1040" y="1088" font-size="21" text-anchor="start" fill="#172033">Keep later entries queued.</text>
<path d="M755 935 L1245 972" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#tip)"/>
<rect x="40" y="1150" width="1420" height="105" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="1189" font-size="26" text-anchor="start" fill="#172033">Rules that apply across these decisions</text>
<text x="60" y="1228" font-size="21" text-anchor="start" fill="#172033">Required restores remain allowed. Submitted transfers are not cancelled. GPU source data stays valid until copying completes.</text>
</g></svg>