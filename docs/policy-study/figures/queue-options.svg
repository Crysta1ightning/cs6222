<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#172033">
<text x="40" y="45" font-size="29" text-anchor="start" fill="#172033">Queue: [A, B, V, C, D] — V is the eviction victim to preserve</text>
<text x="40" y="85" font-size="22" text-anchor="start" fill="#172033">Entries are ordered from left to right. Choose how much pending data to copy to CPU memory.</text>
<text x="440" y="140" font-size="24" text-anchor="start" fill="#172033">Copy to CPU RAM</text>
<text x="1020" y="140" font-size="24" text-anchor="start" fill="#172033">Remain queued</text>
<text x="40" y="217" font-size="25" text-anchor="start" fill="#172033">Flush all</text>
<rect x="440" y="175" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="460" y="214" font-size="26" text-anchor="start" fill="#172033">A</text>
<rect x="535" y="175" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="555" y="214" font-size="26" text-anchor="start" fill="#172033">B</text>
<rect x="630" y="175" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="650" y="214" font-size="26" text-anchor="start" fill="#172033">V</text>
<rect x="725" y="175" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="745" y="214" font-size="26" text-anchor="start" fill="#172033">C</text>
<rect x="820" y="175" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="840" y="214" font-size="26" text-anchor="start" fill="#172033">D</text>
<text x="1020" y="217" font-size="24" text-anchor="start" fill="#172033">None</text>
<text x="40" y="357" font-size="25" text-anchor="start" fill="#172033">Victim only</text>
<rect x="440" y="315" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="460" y="354" font-size="26" text-anchor="start" fill="#172033">V</text>
<rect x="1020" y="315" width="75" height="80" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1040" y="354" font-size="26" text-anchor="start" fill="#172033">A</text>
<rect x="1120" y="315" width="75" height="80" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1140" y="354" font-size="26" text-anchor="start" fill="#172033">B</text>
<rect x="1220" y="315" width="75" height="80" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1240" y="354" font-size="26" text-anchor="start" fill="#172033">C</text>
<rect x="1320" y="315" width="75" height="80" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1340" y="354" font-size="26" text-anchor="start" fill="#172033">D</text>
<text x="40" y="497" font-size="25" text-anchor="start" fill="#172033">Through victim</text>
<rect x="440" y="455" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="460" y="494" font-size="26" text-anchor="start" fill="#172033">A</text>
<rect x="535" y="455" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="555" y="494" font-size="26" text-anchor="start" fill="#172033">B</text>
<rect x="630" y="455" width="75" height="80" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="650" y="494" font-size="26" text-anchor="start" fill="#172033">V</text>
<rect x="1020" y="455" width="75" height="80" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1040" y="494" font-size="26" text-anchor="start" fill="#172033">C</text>
<rect x="1120" y="455" width="75" height="80" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
<text x="1140" y="494" font-size="26" text-anchor="start" fill="#172033">D</text>
<rect x="40" y="615" width="1420" height="150" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="60" y="654" font-size="26" text-anchor="start" fill="#172033">All three strategies preserve V while choosing different amounts of extra work</text>
<text x="60" y="693" font-size="21" text-anchor="start" fill="#172033">Flush all maximizes batching. Victim only minimizes immediate copy volume. Through victim preserves queue order.</text>
<text x="60" y="723" font-size="21" text-anchor="start" fill="#172033">The copy must finish before the corresponding GPU storage is reused.</text>
<text x="60" y="753" font-size="21" text-anchor="start" fill="#172033">Blue entries are copied; grey entries remain queued. Prefix dependencies and active-request locks still apply.</text>
</g></svg>